# mediamtx config: RTMP in, LL-HLS out on the pod's public port.
# One path per camera: arena (wide), one POV per contestant, and the guest
# creeper feed (only publishes while a viewer is playing a turn — a 404 on
# /guest/index.m3u8 between turns is normal).
rtmpAddress: :1935
hlsAddress: :8080
hlsAllowOrigin: "*"
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
webrtcAddress: :8889
webrtcAllowOrigin: "*"
# RunPod's HTTP proxy handles WHEP signaling. STUN supplies a reachable media
# candidate when a fixed UDP port is not exposed by the pod.
webrtcLocalUDPAddress: ""
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
paths:
  arena:
    source: publisher
  cinder:
    source: publisher
  vex:
    source: publisher
  mira:
    source: publisher
  tally:
    source: publisher
  guest:
    source: publisher
